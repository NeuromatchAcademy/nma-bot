[project]
name = "nma-bot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "discord-py>=2.7.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
]

[tool.uv]
required-version = ">=0.13.6"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["known_bug(reason): test pins currently-broken behaviour on purpose"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
extend-exclude = [".venv", ".superpowers"]
